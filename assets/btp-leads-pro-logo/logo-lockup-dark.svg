<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&amp;display=swap');
      .word { font-family: 'Poppins', sans-serif; font-weight: 800; }
      .tag  { font-family: 'Poppins', sans-serif; font-weight: 600; letter-spacing: 3px; }
    </style>
    <linearGradient id="slate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#94A3B8"/>
      <stop offset="1" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#EA580C"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- icon -->
  <g transform="translate(10,18) scale(0.5)">
    <path d="M 34 190 L 200 56 L 366 190" fill="none" stroke="url(#slate)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="284" y="70" width="34" height="66" rx="4" fill="url(#slate)"/>
    <rect x="138" y="232" width="36" height="108" rx="8" fill="url(#orange)"/>
    <rect x="184" y="188" width="36" height="152" rx="8" fill="url(#orange)"/>
    <rect x="230" y="214" width="36" height="126" rx="8" fill="url(#orange)"/>
    <path d="M 40 300 C 100 340, 200 335, 258 322 C 288 313, 302 272, 330 205" fill="none" stroke="url(#blue)" stroke-width="26" stroke-linecap="round"/>
    <path d="M 345 168 L 351 222 L 303 202 Z" fill="url(#blue)"/>
  </g>

  <!-- wordmark -->
  <text x="228" y="128" class="word" font-size="66">
    <tspan fill="#FB923C">BTP</tspan><tspan fill="#F8FAFC">leads</tspan><tspan fill="#38BDF8">Pro</tspan>
  </text>

  <!-- tagline -->
  <text x="230" y="164" class="tag" font-size="17" fill="#94A3B8">LEADS QUALIFIÉS POUR TOITURE &amp; FAÇADE</text>
  <rect x="230" y="178" width="560" height="2" fill="#334155"/>
</svg>
